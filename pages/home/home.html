<style>
  /* Page-specific bottom navigation, independent of the fixed curved menu. */
  .wedding-next-page {
    display: flex;
    justify-content: center;
    padding: 36px 18px
      calc(var(--nav-height, 80px) + 48px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  .wedding-next-page-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 52px;
    padding: 13px 26px;
    border: 1px solid #c8b6a8;
    border-radius: 999px;
    background: #fffaf5;
    color: #68574e;
    text-decoration: none;
    font:
      600 1.15rem "Cormorant Garamond",
      serif;
    letter-spacing: 0.03em;
    box-shadow: 0 8px 24px rgba(58, 48, 43, 0.1);
    transition:
      transform 0.2s ease,
      background 0.2s ease;
  }
  .wedding-next-page-link:hover {
    background: #f4e9df;
    transform: translateY(-2px);
  }
  .wedding-next-page-link:focus-visible {
    outline: 3px solid #ad8174;
    outline-offset: 4px;
  }
  .wedding-next-page-link i {
    font-size: 0.85em;
  }
  @media (prefers-reduced-motion: reduce) {
    .wedding-next-page-link {
      transition: none;
    }
  }
</style>
<!-- SPA home partial; requires existing global styles, Font Awesome, GSAP and ScrollTrigger -->
<main class="page-container">
  <section class="wedding-hero">
    <div class="hero-slideshow" aria-hidden="true"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="couple-name">
        <span>Rhaf</span><span class="ampersand">&amp;</span><span>Jen</span>
      </h1>
    </div>
    <div class="hero-countdown" aria-label="Wedding countdown">
      <div class="countdown-item">
        <div class="countdown-line">
          <strong id="days" class="countdown-number">000</strong>
        </div>
        <span class="countdown-label">DAYS</span>
      </div>
      <div class="countdown-item">
        <div class="countdown-line">
          <strong id="hours" class="countdown-number">00</strong>
        </div>
        <span class="countdown-label">HOURS</span>
      </div>
      <div class="countdown-item">
        <div class="countdown-line">
          <strong id="minutes" class="countdown-number">00</strong>
        </div>
        <span class="countdown-label">MINUTES</span>
      </div>
      <div class="countdown-item">
        <div class="countdown-line">
          <strong id="seconds" class="countdown-number">00</strong>
        </div>
        <span class="countdown-label">SECONDS</span>
      </div>
    </div>
  </section>
  <section class="expo-section" aria-label="Prenup photo showcase">
    <div class="home-gallery-heading">
      <span>CAPTURED MOMENTS</span>
      <h2>Our Gallery</h2>
      <p>
        Little glimpses from our journey — preserved in frames, shared with
        love.
      </p>
    </div>
    <div
      class="expo-stage"
      tabindex="0"
      role="region"
      aria-roledescription="carousel"
      aria-label="Prenup photos"
    >
      <div class="expo-track"></div>
    </div>
  </section>
  <section class="home-video-section" aria-labelledby="homeVideoTitle">
    <h3 class="home-video-secondary-title" id="homeVideoTitle">
      Before We Say “I Do”
    </h3>
    <div class="home-video-collection">
      <div class="home-video-entry">
        <button
          type="button"
          class="home-video-preview"
          id="homeVideoOpen"
          data-home-video="prenup"
          aria-label="Watch Rhaf and Jen's prenup film"
        >
          <img
            src="images/prenup/prenup22.webp"
            alt="Rhaf and Jen prenup film cover"
            loading="lazy"
            decoding="async"
          />
          <span class="home-video-preview-overlay"
            ><span class="home-video-play"
              ><i class="fa-solid fa-play" aria-hidden="true"></i></span
            ><span class="home-video-watch">WATCH OUR FILM</span></span
          >
        </button>
      </div>
      <div class="home-video-entry">
        <h3 class="home-video-secondary-title">She Said Yes!</h3>
        <button
          type="button"
          class="home-video-preview"
          id="homeVideoOpenSecond"
          data-home-video="second"
          aria-label="Watch Rhaf and Jen's second video"
        >
          <img
            src="https://i.ytimg.com/vi/KYkteeVvgmw/hqdefault.jpg"
            alt="Rhaf and Jen second video cover"
            loading="lazy"
            decoding="async"
          />
          <span class="home-video-preview-overlay"
            ><span class="home-video-play"
              ><i class="fa-solid fa-play" aria-hidden="true"></i></span
            ><span class="home-video-watch">WATCH OUR FILM</span></span
          >
        </button>
      </div>
    </div>
  </section>
  <section class="home-gallery" id="homeGallery">
    <div class="home-gallery-grid"></div>
  </section>
  <nav class="wedding-next-page" aria-label="Continue to the next wedding page">
    <a
      class="wedding-next-page-link"
      href="wedding.html?page=sponsors"
      data-page="sponsors"
      >Next Page: Sponsors
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i
    ></a>
  </nav>
</main>
