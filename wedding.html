<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<script>
    (() => {
      try {
        if (
          sessionStorage.getItem(
            "weddingDirectEntry"
          ) === "1"
        ) {
          document.documentElement.classList.add(
            "wedding-direct-entry"
          );
        }
      } catch {
        // Continue normally.
      }
    })();
  </script>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#8c997d"
  />

  <title>RhaFoundHisJen</title>

  <link
    rel="icon"
    type="image/webp"
    href="images/rhafjenLogo.webp"
  />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />

  <link
    rel="preload"
    as="image"
    href="images/rhafjenone.webp"
    fetchpriority="high"
  />

  <!-- Lottie Player -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <!-- Critical loader CSS -->
  <style>
  html,
  body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #8c997d;
  }

  body.spa-initializing {
    overflow: hidden;
  }

  body.spa-initializing #app,
  body.spa-initializing #globalNavigation,
  body.spa-initializing #musicButton,
  body.spa-initializing .music-button {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .page-transition-loader {
    position: fixed;
    inset: 0;
    z-index: 999999;

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .page-transition-loader.is-visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .page-transition-loader-content {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #pageLoaderAnimation {
    display: block;
    width: 240px;
    height: 240px;
  }
html.wedding-direct-entry
.page-transition-loader {
  display:
    none !important;
}

/* ==========================================================
   WEDDING.HTML — MATCHING PAGE FLIP IN
========================================================== */

html.wedding-direct-entry,
html.wedding-direct-entry body {
  overflow:
    hidden;

 background-image:
    url("../images/indexBackground.png");

  background-repeat: repeat;

  /* Adjust this to control diamond size */
  background-size: 680px auto;

  background-position:
    center top;

  pointer-events: none;

  perspective:
    1600px;
}


/*
 * ACTUAL wedding Home page.
 *
 * Starts edge-on and flips toward user.
 */
html.wedding-direct-entry
body:not(.spa-initializing)
#app {
  animation:
    weddingDirectPageFlipIn
    0.85s
    cubic-bezier(
      0.77,
      0,
      0.18,
      1
    )
    both;

  transform-origin:
    right center;

  backface-visibility:
    hidden;

  will-change:
    transform,
    opacity;
}


/*
 * Navigation appears near the end
 * so it doesn't float around during flip.
 */
html.wedding-direct-entry
body:not(.spa-initializing)
#globalNavigation {
  animation:
    weddingDirectNavigationEnter
    0.45s
    ease-out
    0.62s
    both;
}


/* ==========================================================
   ACTUAL PAGE FLIP
========================================================== */

@keyframes weddingDirectPageFlipIn {

  0% {
    opacity:
      0.35;

    transform:
      perspective(1600px)
      rotateY(90deg)
      translateX(8%)
      scale(0.98);
  }


  35% {
    opacity:
      1;
  }


  100% {
    opacity:
      1;

    transform:
      perspective(1600px)
      rotateY(0deg)
      translateX(0)
      scale(1);
  }

}


/* ==========================================================
   NAVIGATION
========================================================== */

@keyframes weddingDirectNavigationEnter {

  from {
    opacity:
      0;

    transform:
      translateY(28px);
  }


  to {
    opacity:
      1;

    transform:
      translateY(0);
  }

}


/* ==========================================================
   REDUCED MOTION
========================================================== */

@media (
  prefers-reduced-motion:
  reduce
) {

  html.wedding-direct-entry
  body:not(.spa-initializing)
  #app,

  html.wedding-direct-entry
  body:not(.spa-initializing)
  #globalNavigation {
    animation:
      none !important;

    opacity:
      1 !important;

    transform:
      none !important;
  }

}

</style>

  <link
    rel="stylesheet"
    href="css/style.css"
  />
</head>

<body
  data-current-page="home"
  class="spa-initializing"
>

  <!-- Dynamic SPA content -->
  <div
    id="app"
    aria-busy="true"
  ></div>

  <!-- Permanent navigation -->
  <div id="globalNavigation"></div>

  <!-- Single Lottie loader only -->
  <div
    class="page-transition-loader is-visible"
    id="pageTransitionLoader"
    aria-hidden="false"
    aria-label="Loading wedding invitation"
  >
    <div class="page-transition-loader-content">

      <lottie-player
        id="pageLoaderAnimation"
        src="images/Loadingwedding.json"
        background="transparent"
        speed="1"
        loop
        autoplay
      ></lottie-player>

    </div>
  </div>

    <!-- GSAP -->
  <script
    src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"
  ></script>
  <!-- GSAP ScrollTrigger -->
  <script
    src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"
  ></script>
  <!-- Permanent global scripts -->
  <!-- Permanent global scripts -->
  <script src="js/common.js"></script>
  <script src="js/music.js"></script>

  <!-- SPA router / loader -->
  <script src="js/app.js"></script>

</body>
</html>
